[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcq-llm-eval"
version = "0.2.0"
description = "Resumable, schema-validated LLM annotation runner for the RCQ taxonomy."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.114,<1",
  "openai>=1.55,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
rcq-llm-eval = "rcq_llm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
